# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    open-pull-requests-limit: 15
    schedule:
      interval: 'weekly'
      timezone: 'Europe/Berlin'
    assignees:
      - 'typhosj'

  - package-ecosystem: 'npm'
    directory: '/'
    open-pull-requests-limit: 15
    schedule:
      interval: 'weekly'
      timezone: 'Europe/Berlin'
    assignees:
      - 'typhosj'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      # The adapter declares Node 22; a major @types/node bump would silently raise the
      # assumed runtime API surface.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint (via @iobroker/eslint-config) declares a peer range that ends
      # below TypeScript 7, and TypeScript 7 no longer exposes the API it loads.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
